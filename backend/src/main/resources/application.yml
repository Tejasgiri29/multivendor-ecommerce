server:
  port: 8080

spring:
  application:
    name: multivendor-ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    # MUST be at least 32 characters. Override in production via JWT_SECRET.
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
